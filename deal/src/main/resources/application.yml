spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/credit_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  kafka:
    bootstrap-servers: kafka:9092

server:
  port: 8081

logging:
  level:
    root: INFO
    com.remizov: DEBUG

calculator:
  url: http://localhost:8080
